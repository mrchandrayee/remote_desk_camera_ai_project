app:
  title: "Remote and Camera AI"
  host: "127.0.0.1"
  port: 8000
  frame_width: 1280
  jpeg_quality: 80
  motion_threshold: 22
  motion_min_area: 1200

sources:
  desktop:
    enabled: true
    name: "This Desktop"
    monitor: 1  # mss monitor 1; 0 means all monitors combined
  cameras:
    # Replace source with an RTSP URL, webcam index (0), or video file.
    - id: "camera_01"
      name: "Front Gate"
      source: "0"
      enabled: false
    - id: "camera_02"
      name: "Parking"
      source: "rtsp://username:password@192.168.1.20:554/stream1"
      enabled: false
